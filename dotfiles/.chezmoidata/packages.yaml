packages:
  ubuntu:
    extrepo:
      - google_chrome
      - mise
      - protonvpn
      - signal
      - spotify
      - steam
    source_scripts:
      - sudo wget -O /etc/apt/sources.list.d/ppa.sources https://ppa.parker.dev/ppa.sources
    apt:
      install:
        - btop
        - curl
        - fastfetch
        - fzf
        - gh
        - ghostty
        - git
        - gnome-shell-extension-appindicator
        - gnome-shell-extension-manager
        - gnome-shell-extension-user-theme
        - gnome-tweaks
        - gnome-weather
        - google-chrome-stable
        - mise
        - proton-vpn-gnome-desktop
        - signal-desktop
        - spotify-client
        - steam-launcher
        - zsh
        - zsh-antidote
      remove: []
    snap:
      install:
        - discord
        - docker
      classic:
        - chezmoi
      remove:
        - firefox
    python:
      install: []
      remove: []
      user: []
